plugins { id 'com.android.application' }
def config = new groovy.json.JsonSlurper().parse(file('../job.json'))
android {
    namespace 'io.forgekit.shell'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId config.settings.packageName
        minSdk 21
        targetSdk 36
        versionCode config.settings.versionCode
        versionName config.settings.versionName
        multiDexEnabled true
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        manifestPlaceholders = [dcloudAppKey: config.settings.appKey]
    }
    buildTypes {
        release {
            debuggable = config.input.buildType == 'debug'
            minifyEnabled false
            signingConfig = null
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    androidResources { additionalParameters.add('--auto-add-overlay'); ignoreAssetsPattern = '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~' }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.webkit:webkit:1.5.0'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:middleware:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
