# Isolated optional identity provider. Not suitable for production.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${FORGEKIT_OIDC_ADMIN_USER:?Set local-only admin name}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FORGEKIT_OIDC_ADMIN_PASSWORD:?Set local-only admin password}
      KC_HOSTNAME: http://127.0.0.1:18080
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./infra/keycloak/forgekit-dev-realm.json:/opt/keycloak/data/import/forgekit-dev-realm.json:ro
    restart: "no"
