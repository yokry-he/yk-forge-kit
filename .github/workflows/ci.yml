name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Startup without prebuilt workspace packages
        run: corepack pnpm test:startup
      - run: corepack pnpm typecheck
      - run: corepack pnpm db:migrations:check
      - run: corepack pnpm test
      - name: B18 native signer contracts (no Android SDK install)
        run: python3 -m unittest discover -s infra/android -p 'test_*.py'

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_test_only
          MYSQL_DATABASE: forgekit_test
          MYSQL_USER: forgekit_test
          MYSQL_PASSWORD: ci_user_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FORGEKIT_DB_INTEGRATION: '1'
      FORGEKIT_WORKER_INTEGRATION: '1'
      FORGEKIT_PREVIEW_INTEGRATION: '1'
      REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: mysql://forgekit_test:ci_user_test_only@127.0.0.1:3306/forgekit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm db:migrations:check
      - name: MySQL migrations and repositories (including B07)
        run: corepack pnpm db:test:integration
      - run: corepack pnpm build
      - name: B11 preview links, real persistence and fixture artifact HTTP end-to-end
        run: corepack pnpm --filter @forgekit/api exec vitest run test/preview-links.integration.test.ts
      - name: B08 API producer, worker, persisted logs and restart recovery
        run: corepack pnpm --filter @forgekit/api exec vitest run test/build-queue.integration.test.ts
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/mysql-project-flow.test.ts
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/oidc-http.mysql.test.ts
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/project-claim.mysql.test.ts

  keycloak-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_test_only
          MYSQL_DATABASE: forgekit_test
          MYSQL_USER: forgekit_test
          MYSQL_PASSWORD: ci_user_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FORGEKIT_DB_INTEGRATION: '1'
      DATABASE_URL: mysql://forgekit_test:ci_user_test_only@127.0.0.1:3306/forgekit_test
      FORGEKIT_KEYCLOAK_E2E: '1'
      FORGEKIT_KEYCLOAK_URL: http://127.0.0.1:18080
      # Disposable, CI-only Keycloak admin; the container is destroyed with the runner.
      FORGEKIT_KEYCLOAK_ADMIN_USER: ci_admin
      FORGEKIT_KEYCLOAK_ADMIN_PASSWORD: ci_admin_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable Keycloak with the development realm
        run: |
          docker run -d --name keycloak -p 127.0.0.1:18080:18080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$FORGEKIT_KEYCLOAK_ADMIN_USER" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$FORGEKIT_KEYCLOAK_ADMIN_PASSWORD" \
            -e KC_HOSTNAME=http://127.0.0.1:18080 \
            -v "$PWD/infra/keycloak/forgekit-dev-realm.json:/opt/keycloak/data/import/forgekit-dev-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm --http-port=18080
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: MySQL migrations and repositories (including B07)
        run: corepack pnpm db:test:integration
      - run: corepack pnpm build
      - name: Wait for Keycloak realm
        run: |
          for i in $(seq 1 90); do
            curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/realms/forgekit-dev/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak | tail -50
          exit 1
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/keycloak-oidc.mysql.test.ts
      - name: Keycloak logs on failure
        if: failure()
        run: docker logs keycloak | tail -100

  docker-runner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORGEKIT_DOCKER_RUNNER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @forgekit/worker... build
      - name: Pull trusted Node image before isolated builds
        run: docker pull node:22
      - name: Build B17 trusted upload image and offline SDK fixture
        run: |
          docker build --target final -f infra/weapp/Dockerfile -t forgekit-weapp:b17 .
          docker build --target test -f infra/weapp/Dockerfile -t forgekit-weapp-test:b17 .
      - name: B17 isolated upload and QR artifact with mocked SDK (no WeChat network)
        run: corepack pnpm --filter @forgekit/worker exec vitest run test/weapp-runner.integration.test.ts
      - name: B20 isolated Alipay upload with offline SDK and QR fixture (no Alipay network)
        run: |
          docker build --target test -f infra/alipay/Dockerfile -t forgekit-alipay-test:b20 .
          corepack pnpm --filter @forgekit/worker exec vitest run test/alipay-runner.integration.test.ts
      - name: B09 real Vue and Nuxt builds, artifacts and build network isolation
        run: corepack pnpm --filter @forgekit/worker exec vitest run test/docker-runner.integration.test.ts

  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORGEKIT_TEMPLATE_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - name: Generate, install, build and check static output of project templates
        run: corepack pnpm --filter @forgekit/cli exec vitest run test/templates.test.ts
      # B19 checks generated Rust on Linux; Windows/macOS installer jobs live INSIDE the template.
      - name: Install Tauri Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/forgekit-desktop-target
          # Keep old cache archives from restoring files into the project destination.
          key: ${{ runner.os }}-b19-cargo-v2-${{ hashFiles('packages/project-core/src/tauri-desktop.ts') }}
          restore-keys: ${{ runner.os }}-b19-cargo-v2-
      - name: Generate desktop project and check Rust backend
        timeout-minutes: 20
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/forgekit-desktop-target
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/forgekit-desktop-smoke"
          node packages/cli/dist/index.js create desktop-check --template tauri-desktop --dir "$RUNNER_TEMP/forgekit-desktop-smoke"
          cd "$RUNNER_TEMP/forgekit-desktop-smoke/desktop-check"
          corepack pnpm install --no-frozen-lockfile
          corepack pnpm icons
          cargo check --manifest-path src-tauri/Cargo.toml

  ssh-deploy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s --health-timeout=3s --health-retries=30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_test_only
          MYSQL_DATABASE: forgekit_test
          MYSQL_USER: forgekit_test
          MYSQL_PASSWORD: ci_user_test_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      FORGEKIT_DB_INTEGRATION: '1'
      FORGEKIT_SSH_DEPLOY_INTEGRATION: '1'
      FORGEKIT_DOMAIN_HTTPS_INTEGRATION: '1'
      DATABASE_URL: mysql://forgekit_test:ci_user_test_only@127.0.0.1:3306/forgekit_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm db:migrations:check
      - run: corepack pnpm --filter @forgekit/api... --filter @forgekit/worker build
      - name: B13/B15 MySQL claims, target locks, log ordering and runtime quotas
        run: corepack pnpm --filter @forgekit/db exec vitest run --no-file-parallelism test/domain-repositories.mysql.test.ts test/runtime-log-repositories.mysql.test.ts
      - name: Build disposable Linux sshd (no cloud credentials)
        run: docker build -t forgekit-sshd-test:b12 infra/ssh-test
      - name: B12/B15 SSH deploy, runtime tail/follow redaction, cancellation, pinning and SSE
        run: corepack pnpm --filter @forgekit/api exec vitest run test/ssh-deploy.integration.test.ts
      - name: Build disposable sshd and Caddy with offline internal CA
        run: docker build -t forgekit-https-test:b13 -f infra/https-test/Dockerfile .
      - name: B13 DNS ownership, SSH config, offline HTTPS, rollback and persisted SSE logs
        run: corepack pnpm --filter @forgekit/api exec vitest run test/domain-dns.integration.test.ts test/domain-https.integration.test.ts
      - name: B13 real Caddy reload failure and crash recovery on unprivileged ports
        run: |
          docker create --name forgekit-caddy-bin forgekit-https-test:b13
          docker cp forgekit-caddy-bin:/usr/bin/caddy "$RUNNER_TEMP/caddy"
          docker rm forgekit-caddy-bin
          PATH="$RUNNER_TEMP:$PATH" FORGEKIT_CADDY_INTEGRATION=1 corepack pnpm --filter @forgekit/worker exec vitest run test/domain-caddy.integration.test.ts
