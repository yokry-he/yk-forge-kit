name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Startup without prebuilt workspace packages
        run: corepack pnpm test:startup
      - run: corepack pnpm typecheck
      - run: corepack pnpm db:migrations:check
      - run: corepack pnpm test

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_test_only
          MYSQL_DATABASE: forgekit_test
          MYSQL_USER: forgekit_test
          MYSQL_PASSWORD: ci_user_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FORGEKIT_DB_INTEGRATION: '1'
      FORGEKIT_WORKER_INTEGRATION: '1'
      REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: mysql://forgekit_test:ci_user_test_only@127.0.0.1:3306/forgekit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm db:migrations:check
      - name: MySQL migrations and repositories (including B07)
        run: corepack pnpm db:test:integration
      - run: corepack pnpm build
      - name: B08 API producer, worker, persisted logs and restart recovery
        run: corepack pnpm --filter @forgekit/api exec vitest run test/build-queue.integration.test.ts
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/mysql-project-flow.test.ts
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/oidc-http.mysql.test.ts
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/project-claim.mysql.test.ts

  keycloak-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_test_only
          MYSQL_DATABASE: forgekit_test
          MYSQL_USER: forgekit_test
          MYSQL_PASSWORD: ci_user_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      FORGEKIT_DB_INTEGRATION: '1'
      DATABASE_URL: mysql://forgekit_test:ci_user_test_only@127.0.0.1:3306/forgekit_test
      FORGEKIT_KEYCLOAK_E2E: '1'
      FORGEKIT_KEYCLOAK_URL: http://127.0.0.1:18080
      # Disposable, CI-only Keycloak admin; the container is destroyed with the runner.
      FORGEKIT_KEYCLOAK_ADMIN_USER: ci_admin
      FORGEKIT_KEYCLOAK_ADMIN_PASSWORD: ci_admin_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable Keycloak with the development realm
        run: |
          docker run -d --name keycloak -p 127.0.0.1:18080:18080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$FORGEKIT_KEYCLOAK_ADMIN_USER" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$FORGEKIT_KEYCLOAK_ADMIN_PASSWORD" \
            -e KC_HOSTNAME=http://127.0.0.1:18080 \
            -v "$PWD/infra/keycloak/forgekit-dev-realm.json:/opt/keycloak/data/import/forgekit-dev-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm --http-port=18080
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: MySQL migrations and repositories (including B07)
        run: corepack pnpm db:test:integration
      - run: corepack pnpm build
      - name: Wait for Keycloak realm
        run: |
          for i in $(seq 1 90); do
            curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/realms/forgekit-dev/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak | tail -50
          exit 1
      - run: corepack pnpm --filter @forgekit/api exec vitest run test/keycloak-oidc.mysql.test.ts
      - name: Keycloak logs on failure
        if: failure()
        run: docker logs keycloak | tail -100

  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORGEKIT_TEMPLATE_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - name: Generate, install, build and check static output of project templates
        run: corepack pnpm --filter @forgekit/cli exec vitest run test/templates.test.ts
