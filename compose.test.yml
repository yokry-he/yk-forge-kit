# Ephemeral, localhost-only MySQL 8.0 for YKForgeKit integration tests.
# No named volumes: database data is discarded when the container is removed.
services:
  redis-test:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:36379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${FORGEKIT_TEST_ROOT_PASSWORD:?Set a test-only root password in .env.test}
      MYSQL_DATABASE: forgekit_test
      MYSQL_USER: forgekit_test
      MYSQL_PASSWORD: ${FORGEKIT_TEST_DB_PASSWORD:?Set a test-only user password in .env.test}
    ports:
      - "127.0.0.1:33306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
